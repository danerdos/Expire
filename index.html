<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152e34"><title>Expiry Tracker</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header class="top"><div class="brand"><span class="brand-icon">◷</span><div><h1>Expiry Tracker</h1><p>Keep your products in check</p></div></div><span class="today" id="today"></span></header>
<main><section id="home" class="screen active"><div class="intro"><span class="eyebrow">OVERVIEW</span><h2>Expiry dashboard</h2><p>Select a card to see products expiring on that day.</p></div><div id="cards" class="cards"></div></section>
<section id="products" class="screen"><button class="back" id="backBtn">← Back to dashboard</button><div class="intro"><span class="eyebrow">PRODUCTS</span><h2 id="listTitle">Products</h2><p id="listSubtitle"></p></div><div id="productList" class="product-list"></div></section>
<section id="all" class="screen"><div class="intro"><span class="eyebrow">INVENTORY</span><h2>All products</h2><p id="allCount">Every product you have saved.</p></div><div id="allProductList" class="product-list"></div></section>
<section id="add" class="screen"><div class="intro"><span class="eyebrow">INVENTORY</span><h2>Add a product</h2><p>Save a product with one or more expiry dates.</p></div><form id="productForm"><label>Product name <span class="required">*</span><input id="name" type="text" placeholder="e.g. Fresh milk" required maxlength="120"></label><label>Barcode <span class="optional">(optional)</span><input id="barcode" type="text" placeholder="Enter barcode" maxlength="100"></label><label>Product photo <span class="optional">(optional)</span><div class="upload"><input id="photo" type="file" accept="image/*"><img id="preview" alt="Product preview" hidden><span id="uploadHint">Choose an image</span></div></label><div class="date-heading"><span>Expiry dates <span class="required">*</span></span><button type="button" class="add-date" id="addDate">+ Add date</button></div><div id="dateFields"></div><button type="submit" class="save">Save product</button><p id="formMessage" role="status"></p></form></section></main>
<nav class="bottom"><button id="homeTab" class="nav-item selected" type="button"><span>▦</span>Home</button><button id="allTab" class="nav-item" type="button"><span>▤</span>All Products</button><button id="addTab" class="nav-item" type="button"><span>＋</span>Add Product</button></nav></div><script src="script.js"></script></body></html>
